<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Dog-Ear Reading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@400;700&family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: one notebook page at a time on a desk, spiral-bound on the left; pages turn from the dog-eared corners. */
:root {
  --desk: #c9d3cf;
  --desk-deep: #b3c0bb;
  --desk-ink: #22302d;
  --desk-muted: #4c5c58;
  --chrome: #f4f6f3;
  --chrome-line: #c3ccc8;
  --accent: #2c6b64;
  --accent-ink: #ffffff;
  --paper: #fbf9f3;
  --paper-back: #ece6d7;
  --paper-edge: #ddd6c4;
  --ink: #1f2a33;
  --ink-soft: #5d6670;
  --rule: #bcd0e2;
  --margin: #e2a3a3;
  --wood: #8a5a3b;
  --wood-dark: #5e3b25;
  --danger: #a33a32;
  --display: "Young Serif", Georgia, serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --text: "Charis SIL", Charter, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #1a2120; --desk-deep: #111716; --desk-ink: #e1e8e5; --desk-muted: #9fb0aa;
    --chrome: #232c2a; --chrome-line: #34403d; --accent: #6fbdb2; --accent-ink: #0d1a18;
    --paper: #f1eee6; --paper-back: #d9d2c1; --paper-edge: #c4bca9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #1a2120; --desk-deep: #111716; --desk-ink: #e1e8e5; --desk-muted: #9fb0aa;
  --chrome: #232c2a; --chrome-line: #34403d; --accent: #6fbdb2; --accent-ink: #0d1a18;
  --paper: #f1eee6; --paper-back: #d9d2c1; --paper-edge: #c4bca9;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--desk);
  background-image: radial-gradient(ellipse at 50% 40%, transparent 40%, var(--desk-deep) 120%);
  color: var(--desk-ink);
  font-family: var(--ui);
  font-size: 15px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-inline: 16px; padding-block: 10px 18px; }
.topbar { width: 100%; max-width: 1240px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-size: 19px; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--ui); font-size: 12px; color: var(--desk-muted); letter-spacing: .06em; text-transform: uppercase; }
.save { font-size: 12px; color: var(--desk-muted); }

/* ---------- editor toolbar ---------- */
.toolbar {
  width: 100%; max-width: 1240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
  background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 10px; padding: 6px 8px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
}
.tgroup { display: flex; align-items: center; gap: 2px; padding-inline: 4px; border-right: 1px solid var(--chrome-line); }
.tgroup:last-child { border-right: 0; }
.tb { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; background: transparent; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
.tb:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tb.on { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.tb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.font-btn { min-width: 168px; justify-content: space-between; border-color: var(--chrome-line); background: var(--chrome); }
.font-btn span { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size-sel { height: 32px; border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 6px; padding: 0 4px; }
.swatch-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); display: inline-block; }
.hl-dot { width: 16px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); display: inline-block; }

.pop {
  position: absolute; z-index: 60; background: var(--chrome); color: var(--desk-ink); border: 1px solid var(--chrome-line); border-radius: 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,.22); padding: 10px;
}
.font-menu { width: 300px; max-width: calc(100vw - 32px); max-height: 380px; overflow: auto; padding: 6px; }
.font-menu h4 { margin: 8px 8px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--desk-muted); font-weight: 600; }
.font-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; }
.font-item:hover, .font-item.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.font-item .fn { display: block; font-size: 19px; line-height: 1.2; color: var(--desk-ink); }
.font-item .fs { display: block; font-family: var(--ui); font-size: 11px; color: var(--desk-muted); }
.palette { display: grid; grid-template-columns: repeat(6, 26px); gap: 6px; }
.palette button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--chrome); box-shadow: 0 0 0 1px var(--chrome-line); padding: 0; }
.palette button:hover { box-shadow: 0 0 0 2px var(--accent); }
.pop-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; }
.pop-row input[type=color] { width: 36px; height: 28px; border: 1px solid var(--chrome-line); border-radius: 6px; padding: 0; background: none; }

.img-pop { width: 340px; max-width: calc(100vw - 32px); display: grid; gap: 10px; }
.img-pop h3 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 400; }
.img-pop .search { display: flex; gap: 6px; }
.img-pop input[type=search] { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--chrome-line); border-radius: 8px; padding: 0 10px; background: var(--chrome); }
.img-pop ol { margin: 0; padding-left: 20px; font-size: 13px; color: var(--desk-muted); display: grid; gap: 4px; }
.paste-zone { min-height: 64px; border: 2px dashed var(--chrome-line); border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--desk-muted); padding: 8px; outline: none; caret-color: transparent; }
.paste-zone:focus { border-color: var(--accent); color: var(--desk-ink); }
.paste-zone:empty::before { content: attr(data-hint); }
.img-pop .note { font-size: 12px; color: var(--danger); min-height: 1em; margin: 0; }

.btn {
  height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; }

/* ---------- book ---------- */
.stage { width: 100%; display: flex; justify-content: center; padding-left: 14px; }
.book {
  position: relative;
  width: min(100%, 620px, max(300px, calc((100dvh - 160px) / 1.32)));
  aspect-ratio: 1 / 1.32;
  perspective: 2400px;
}
.book::before { /* page block thickness */
  content: ""; position: absolute; inset: 6px -6px -6px 6px; border-radius: 4px 12px 12px 4px;
  background: repeating-linear-gradient(90deg, var(--paper-edge) 0 1px, var(--paper-back) 1px 3px);
  box-shadow: 0 18px 40px rgba(0,0,0,.28);
}
.leaf {
  position: absolute; inset: 0; border-radius: 3px 10px 10px 3px; overflow: hidden;
  transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.18), inset 14px 0 18px -14px rgba(0,0,0,.25);
}
.leaf.flip-out { animation: flipOut .75s cubic-bezier(.45,.05,.3,1) forwards; z-index: 5; }
.leaf.flip-in { animation: flipIn .75s cubic-bezier(.45,.05,.3,1) forwards; z-index: 5; }
@keyframes flipOut { 0% { transform: rotateY(0); filter: brightness(1); } 100% { transform: rotateY(-178deg); filter: brightness(.7); } }
@keyframes flipIn { 0% { transform: rotateY(-178deg); filter: brightness(.7); } 100% { transform: rotateY(0); filter: brightness(1); } }
@media (prefers-reduced-motion: reduce) { .leaf.flip-out, .leaf.flip-in { animation-duration: .01s; } }

.rings { position: absolute; left: -16px; top: 3%; bottom: 3%; width: 34px; display: flex; flex-direction: column; justify-content: space-between; z-index: 20; pointer-events: none; }
.ring { height: 12px; border-radius: 7px; background: linear-gradient(180deg, #f2f4f5 0%, #9aa3a8 45%, #5f676c 60%, #c9cfd2 100%); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
.holes { position: absolute; left: 7px; top: 3%; bottom: 3%; width: 10px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 1; }
.holes i { height: 12px; display: flex; align-items: center; }
.holes i::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #2a2a2a; box-shadow: inset 0 1px 2px #000; opacity: .8; }

/* two-page spread (wide screens) */
.book.spread { width: min(100%, 1240px, max(600px, calc((100dvh - 230px) / 1.32 * 2))); aspect-ratio: 2 / 1.32; transition: transform .6s ease; }
.book.spread::before { inset: 6px -6px -6px -6px; border-radius: 12px; transition: left .6s ease; }
.book.spread.closed { transform: translateX(-25%); }
.book.spread.closed::before { left: calc(50% + 6px); }
.book.spread .leaf.side-left { right: 50%; border-radius: 10px 3px 3px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.18), inset -14px 0 18px -14px rgba(0,0,0,.25); }
.book.spread .leaf.side-right { left: 50%; }
.book.spread .rings { left: calc(50% - 17px); }
.side-left .holes { left: auto; right: 7px; }
.side-left .page-body { padding-left: 26px; padding-right: 40px; }
.entry.side-left .page-body { padding-left: 22px; padding-right: 40px; }
.flipper { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; z-index: 10; }
.flipper.fwd { left: 50%; transform-origin: left center; animation: turnFwd .8s cubic-bezier(.45,.05,.3,1) forwards; }
.flipper.back { left: 0; transform-origin: right center; animation: turnBack .8s cubic-bezier(.45,.05,.3,1) forwards; }
.flipper .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flipper .face.backside { transform: rotateY(180deg); }
.flipper .face > .leaf { left: 0 !important; right: 0 !important; }
@keyframes turnFwd { to { transform: rotateY(-180deg); } }
@keyframes turnBack { to { transform: rotateY(180deg); } }
@media (prefers-reduced-motion: reduce) { .book.spread, .book.spread::before { transition: none; } }

/* bindings */
.bind-ring .rings, .bind-ring .holes { top: 12%; bottom: 12%; }
.bind-ring .ring { height: 24px; border-radius: 13px; background: transparent; border: 5px solid; border-color: #e4e8ea #8d969b #6f777c #c3c9cc; box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 1px 2px rgba(0,0,0,.3); }
.bind-ring .holes i { height: 24px; }
.bind-ring .holes i::before { width: 13px; height: 13px; }
.bind-stitch .rings, .bind-glue .rings { top: 1%; bottom: 1%; align-items: center; }
.rings .thread { width: 0; height: 100%; border-left: 3px dashed #7b4a2e; filter: drop-shadow(0 1px 0 rgba(0,0,0,.35)); }
.rings .glue { width: 18px; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,0,0,.3) 50%, transparent); }

/* dog-ear corners */
.corner { position: absolute; bottom: 0; width: 46px; height: 46px; border: 0; padding: 0; z-index: 15; background: none; transition: width .2s ease, height .2s ease; filter: drop-shadow(-2px -2px 3px rgba(0,0,0,.18)); }
.corner.next { right: 0; background: linear-gradient(135deg, #fffdf8 0%, var(--paper-back) 49.5%, transparent 50%); border-bottom-right-radius: 10px; }
.corner.prev { left: 0; background: linear-gradient(225deg, #fffdf8 0%, var(--paper-back) 49.5%, transparent 50%); filter: drop-shadow(2px -2px 3px rgba(0,0,0,.18)); }
.corner:hover, .corner:focus-visible { width: 74px; height: 74px; }
.corner .tip { position: absolute; bottom: 52px; white-space: nowrap; font-family: var(--hand); font-size: 20px; color: var(--ink-soft); opacity: 0; transition: opacity .2s; pointer-events: none; }
.corner.next .tip { right: 8px; }
.corner.prev .tip { left: 8px; }
.corner:hover .tip, .corner:focus-visible .tip { opacity: 1; bottom: 78px; }
.cover .corner .tip { color: rgba(255,255,255,.85); }
.corner.next.pulse { animation: pulse 2.4s ease-in-out 1s 3; }
@keyframes pulse { 0%,100% { width: 46px; height: 46px; } 50% { width: 66px; height: 66px; } }
@media (prefers-reduced-motion: reduce) { .corner.next.pulse { animation: none; } }

/* ---------- paper pages ---------- */
.paper { background: var(--paper); color: var(--ink); }
.page-body { position: absolute; inset: 0; padding: 26px 26px 52px 40px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.page-title { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4.6vw, 30px); margin: 0; text-wrap: balance; line-height: 1.15; }
.page-sub { margin: 0; font-family: var(--hand); font-size: 22px; color: var(--ink-soft); }
.folio { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-family: var(--hand); font-size: 18px; color: var(--ink-soft); pointer-events: none; }
.ink-btn { align-self: flex-start; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-family: var(--ui); font-weight: 600; font-size: 13px; }
.ink-btn:hover { background: var(--ink); color: var(--paper); }
.sample-note { font-size: 12.5px; color: var(--ink-soft); background: color-mix(in srgb, #f3d27a 35%, var(--paper)); border-radius: 6px; padding: 6px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sample-note button { border: 0; background: none; text-decoration: underline; color: var(--ink); font-size: 12.5px; padding: 0; }

/* cover */
.cover {
  --cover-color: #2f4858; --title-color: #e8d8a8;
  background-color: var(--cover-color); color: var(--title-color);
}
.cover .tex { position: absolute; inset: 0; pointer-events: none; }
.cover.m-leather .tex { background-image: var(--noise), radial-gradient(ellipse at 40% 35%, rgba(255,255,255,.12), transparent 60%), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.35) 100%); background-size: 160px, 100% 100%, 100% 100%; mix-blend-mode: normal; }
.cover.m-leather .stitch { position: absolute; inset: 14px 14px 14px 34px; border: 2px dashed rgba(255,255,255,.28); border-radius: 4px 8px 8px 4px; pointer-events: none; }
.cover.m-linen .tex { background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.25) 100%); }
.cover.m-kraft .tex { background-image: var(--noise), var(--noise), radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.2) 100%); background-size: 90px, 230px, 100% 100%; }
.cover.m-canvas .tex { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 5px), repeating-linear-gradient(-45deg, rgba(0,0,0,.08) 0 2px, transparent 2px 5px), radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.25) 100%); }
.cover.m-smooth .tex { background-image: linear-gradient(115deg, rgba(255,255,255,.18) 0%, transparent 35%, transparent 70%, rgba(0,0,0,.18) 100%); }
.cover-inner { position: absolute; inset: 0; padding: 12% 12% 14% 16%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6%; text-align: center; }
.cover-title { margin: 0; font-size: clamp(26px, 7vw, 46px); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; font-weight: inherit; }
.cover-sub { margin: 0; font-size: clamp(15px, 3.2vw, 20px); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.cover.l-plaque .label { background: #f6f1e4; color: #2b2b2b; padding: 18px 22px; border-radius: 6px; box-shadow: inset 0 0 0 2px #f6f1e4, inset 0 0 0 4px currentColor, 0 4px 10px rgba(0,0,0,.3); max-width: 100%; display: grid; gap: 8px; }
.cover.l-plaque .label .cover-title, .cover.l-plaque .label .cover-sub { color: var(--title-color); }
.cover.l-foil .label { display: grid; gap: 10px; text-shadow: 0 1px 0 rgba(255,255,255,.25), 0 -1px 1px rgba(0,0,0,.5); }
.cover.l-foil .label::before, .cover.l-foil .label::after { content: ""; display: block; height: 2px; margin-inline: 18%; background: currentColor; opacity: .55; }
.cover-photo { width: 62%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 5px #f6f1e4, 0 6px 16px rgba(0,0,0,.35); }
.cover-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strap { position: absolute; top: 0; bottom: 0; right: 9%; width: 13px; background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.25) 40%, rgba(0,0,0,.45)); box-shadow: 0 0 6px rgba(0,0,0,.4); pointer-events: none; }
.customize { position: absolute; top: 14px; right: 14px; z-index: 12; border: 0; border-radius: 999px; padding: 7px 12px; background: rgba(255,255,255,.88); color: #22302d; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.customize svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }

/* owner page */
.bookplate { margin: auto 0; border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 4px; padding: 22px 20px; display: grid; gap: 14px; position: relative; }
.bookplate .ex { font-family: var(--display); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; text-align: center; color: var(--ink-soft); }
.bookplate h2 { margin: 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4.4vw, 30px); }
.hand { width: 100%; border: 0; border-bottom: 1.5px solid var(--rule); background: transparent; font-family: var(--hand); font-size: 24px; color: #24427a; padding: 0 2px; line-height: 1.3; outline: none; }
.hand:focus { border-bottom-color: #24427a; }
.hand::placeholder { color: #9aa6b4; }
.hand.big { font-size: 36px; text-align: center; }
textarea.hand { resize: none; height: 72px; background-image: repeating-linear-gradient(transparent 0 30px, var(--rule) 30px 31px); border-bottom: 0; line-height: 31px; }
.field { display: grid; gap: 0; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
@media (max-width: 520px) { .field-grid { grid-template-columns: 1fr; } }

/* shelf */
.shelf {
  display: flex; flex-wrap: wrap; align-items: flex-end; align-content: flex-start; row-gap: 16px; column-gap: 2px;
  padding: 0 8px; min-height: 126px;
  background: repeating-linear-gradient(180deg, transparent 0 112px, var(--wood) 112px 122px, var(--wood-dark) 122px 126px, transparent 126px 128px);
  background-position: 0 0;
}
.spine-slot { height: 112px; display: flex; align-items: flex-end; margin-bottom: 0; }
.shelf-row-gap { row-gap: 16px; }
.spine {
  border: 0; padding: 6px 0; color: #fff; border-radius: 2px 2px 0 0; position: relative; display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .03em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform .15s;
  box-shadow: inset 3px 0 4px rgba(255,255,255,.18), inset -3px 0 5px rgba(0,0,0,.3);
}
.spine::before, .spine::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.35); }
.spine::before { top: 10px; } .spine::after { bottom: 10px; }
.spine:hover, .spine:focus-visible { transform: rotate(180deg) translateY(6px); }
.spine span { overflow: hidden; text-overflow: ellipsis; max-height: 100%; }
.shelf-empty { font-family: var(--hand); font-size: 22px; color: var(--ink-soft); align-self: center; padding: 30px 6px; }

/* log */
.goal { display: grid; gap: 6px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap; }
.goal-top b { font-family: var(--hand); font-size: 26px; color: var(--ink); font-weight: 700; }
.bar { height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--rule) 55%, var(--paper)); overflow: hidden; }
.bar i { display: block; height: 100%; background: #3c7a6f; border-radius: 6px; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; }
.months div { display: flex; flex-direction: column; justify-content: flex-end; height: 52px; text-align: center; font-size: 10px; color: var(--ink-soft); gap: 2px; }
.months span.col { background: #8fb3c9; border-radius: 3px 3px 0 0; min-height: 2px; }
.year-nav { display: inline-flex; align-items: center; gap: 4px; }
.year-nav button { border: 1px solid var(--rule); background: transparent; border-radius: 6px; width: 30px; height: 30px; color: var(--ink); }
.table-wrap { overflow-x: auto; margin-inline: -4px; }
table.log { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 430px; }
table.log th { text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; padding: 4px 6px; border-bottom: 1.5px solid var(--ink); }

table.log tbody tr { cursor: pointer; }
table.log tbody tr:hover td { background: color-mix(in srgb, var(--rule) 30%, transparent); }
table.log td.t b { display: block; font-weight: 600; }
table.log td.t small { color: var(--ink-soft); }
.stars { color: #c08a1e; letter-spacing: 1px; white-space: nowrap; }
.log-empty { font-family: var(--hand); font-size: 22px; color: var(--ink-soft); text-align: center; padding: 18px 0; }

/* journal entry */
.entry .page-body { padding: 18px 22px 46px 40px; gap: 6px; overflow: hidden; }
.entry-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.entry-head label { display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 10.5px; }
.entry-head input, .entry-head select { border: 0; border-bottom: 1px solid var(--rule); background: transparent; font-family: var(--hand); font-size: 20px; color: #24427a; text-transform: none; letter-spacing: 0; font-weight: 400; max-width: 190px; padding: 0 2px; }
.page-body > * { flex-shrink: 0; }
.canvas { position: relative; flex: 1 1 auto; min-height: 0; }
.canvas::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px); pointer-events: none; }
.canvas::after { content: ""; position: absolute; top: 0; bottom: 0; left: -8px; width: 1px; background: var(--margin); pointer-events: none; }
.editor { position: absolute; inset: 0; overflow-y: auto; outline: none; font-family: var(--text); font-size: 17px; line-height: 28px; padding: 1px 4px 30px; color: var(--ink); overflow-wrap: anywhere; z-index: 1; }
.editor:empty::before { content: attr(data-placeholder); color: #9aa6b4; font-family: var(--hand); font-size: 22px; pointer-events: none; }
.editor ul, .editor ol { margin: 0; padding-left: 24px; }
.editor p, .editor div { margin: 0; }

.sticker { position: absolute; z-index: 3; touch-action: none; cursor: grab; user-select: none; }
.sticker img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
.sticker.f-polaroid { background: #fff; padding: 6% 6% 18%; box-shadow: 0 3px 10px rgba(0,0,0,.28); }
.sticker.f-tape img { box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.sticker.f-tape::before { content: ""; position: absolute; top: -10px; left: 50%; width: 40%; min-width: 40px; height: 22px; transform: translateX(-50%) rotate(-3deg); background: rgba(236, 214, 140, .72); box-shadow: 0 1px 2px rgba(0,0,0,.12); z-index: 1; }
.sticker.f-plain img { box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.sticker.sel { outline: 2px dashed var(--accent); outline-offset: 4px; }
.sticker .s-tools { position: absolute; top: -40px; right: 0; display: none; gap: 4px; z-index: 4; }
.sticker.sel .s-tools { display: flex; }
.sticker .s-tools button { height: 30px; border-radius: 6px; border: 0; background: #22302d; color: #fff; font-size: 12px; padding: 0 9px; font-weight: 600; }
.sticker .s-tools button.del { background: var(--danger); }
.sticker .s-resize { position: absolute; right: -9px; bottom: -9px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; display: none; cursor: nwse-resize; z-index: 4; }
.sticker.sel .s-resize { display: block; }
.sticker.textbox { cursor: default; touch-action: auto; user-select: text; }
.sticker.textbox:hover:not(.sel) { outline: 1px dashed rgba(31,42,51,.3); outline-offset: 2px; }
.tb-body { min-height: 34px; padding: 4px 8px; outline: none; font-family: var(--text); font-size: 17px; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; cursor: text; }
.tb-body:empty::before { content: attr(data-placeholder); color: #9aa6b4; pointer-events: none; }
.tb-body ul, .tb-body ol { margin: 0; padding-left: 22px; }
.tb-handle { position: absolute; top: -16px; left: 0; width: 48px; height: 14px; border-radius: 7px 7px 0 0; background: var(--accent); cursor: grab; display: none; touch-action: none; }
.tb-handle::after { content: ""; position: absolute; left: 14px; right: 14px; top: 5px; height: 4px; border-top: 1px solid rgba(255,255,255,.8); border-bottom: 1px solid rgba(255,255,255,.8); }
.textbox.sel .tb-handle, .textbox:hover .tb-handle { display: block; }
.tlabel { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--desk-muted); font-weight: 600; padding: 0 4px; }
.tb:disabled { opacity: .38; cursor: default; background: transparent; }
.drop-hint { position: absolute; inset: 0; z-index: 8; border: 3px dashed var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); display: grid; place-items: center; font-family: var(--hand); font-size: 26px; color: var(--ink); pointer-events: none; }

/* pager */
.pager { width: 100%; max-width: 620px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
.pager .pbtn { height: 36px; border-radius: 8px; border: 1px solid var(--chrome-line); background: var(--chrome); padding: 0 12px; font-weight: 600; font-size: 14px; color: var(--desk-ink); }
.pager .pbtn:disabled { opacity: .45; cursor: default; }
.pager select { height: 36px; border-radius: 8px; border: 1px solid var(--chrome-line); background: var(--chrome); padding: 0 8px; max-width: 280px; color: var(--desk-ink); }
.pager .pbtn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(10, 18, 16, .5); display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; }
.sheet { width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--chrome); color: var(--desk-ink); border-radius: 14px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 30px 70px rgba(0,0,0,.4); }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--desk-muted); letter-spacing: .02em; min-width: 0; }
.f input, .f select { height: 38px; border: 1px solid var(--chrome-line); border-radius: 8px; padding: 0 10px; background: var(--chrome); color: var(--desk-ink); font-weight: 400; font-size: 15px; min-width: 0; width: 100%; }
.f input[type=color] { padding: 2px; width: 60px; }

@media (min-width: 1000px) { .modal.side { place-items: center end; padding-inline: 40px; background: rgba(10, 18, 16, .18); } .modal.side .sheet { width: 400px; } }
.star-pick { display: flex; gap: 2px; }
.star-pick button { border: 0; background: none; font-size: 26px; line-height: 1; color: #c9b98e; padding: 0 2px; }
.star-pick button.on { color: #c08a1e; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chips button.on { border-color: var(--chrome); box-shadow: 0 0 0 2px var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--desk-ink); }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.sheet-actions .left { margin-right: auto; }
.cover-img-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.finder { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 9%, var(--chrome)); }
.finder-row { display: flex; gap: 8px; }
.finder-row input { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--chrome-line); border-radius: 8px; padding: 0 10px; background: var(--chrome); color: var(--desk-ink); font-size: 15px; }
.finder-msg { margin: 0; font-size: 13px; color: var(--desk-muted); }
.finder-msg:empty { display: none; }
.cover-hits { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
.cover-hits:empty { display: none; }
.cover-hits.pic-hits img { aspect-ratio: 1; }
.pic-hits { max-height: 300px; overflow-y: auto; }
.credit { margin: 0; font-size: 12px; color: var(--desk-muted); }
.credit a { color: inherit; }
.cover-hits button { border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 6px; padding: 4px; display: grid; gap: 4px; font-size: 11px; color: var(--desk-ink); text-align: left; }
.cover-hits button:hover { border-color: var(--accent); }
.cover-hits img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; background: var(--chrome-line); }
.cover-hits span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb { width: 28px; height: 42px; object-fit: cover; border-radius: 2px; float: left; margin-right: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.cover-preview { width: 60px; height: 90px; object-fit: cover; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.finder-list { display: grid; gap: 4px; }
.finder-hit { display: grid; gap: 2px; text-align: left; border: 1px solid var(--chrome-line); background: var(--chrome); border-radius: 8px; padding: 8px 10px; color: var(--desk-ink); }
.finder-hit:hover, .finder-hit:focus-visible { border-color: var(--accent); }
.finder-hit b { font-weight: 600; font-size: 14.5px; }
.finder-hit small { color: var(--desk-muted); font-size: 12.5px; }
.f.filled input { background: color-mix(in srgb, #f3d27a 30%, var(--chrome)); transition: background 1.2s; }
.cover-img-row img { width: 54px; height: 40px; object-fit: cover; border-radius: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #22302d; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100vw - 32px); }

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
};

/* ---------------- storage (IndexedDB, saved on this device) ---------------- */
const Store = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('dogear-journal', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
        r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(key) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }
      catch (e) { res(null); }
    });
  },
  set(key, val) {
    return new Promise(res => {
      if (!this.db) return res(false);
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); }
      catch (e) { res(false); }
    });
  }
};

/* ---------------- rich text toolbar ---------------- */
let savedRange = null;
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  const node = sel.anchorNode;
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  if (sel.rangeCount && el && el.closest('.leaf.current .editor, .leaf.current .tb-body')) {
    activePage = Number(el.closest('.leaf').dataset.page);
    savedRange = sel.getRangeAt(0).cloneRange();
    updateToolbarState();
  }
});
function editorEl() {
  const n = savedRange && savedRange.commonAncestorContainer;
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  const ed = el && el.closest('.editor, .tb-body');
  if (ed && ed.isConnected) return ed;
  return $(`.leaf.current[data-page="${activePage}"] .editor`, book) || $('.leaf.current .editor', book);
}
function restore() {
  const ed = editorEl(); if (!ed) return null;
  ed.focus({ preventScroll: true });
  if (savedRange && ed.contains(savedRange.commonAncestorContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  return ed;
}
function exec(cmd, val) {
  const ed = restore(); if (!ed) return;
  try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
  document.execCommand(cmd, false, val);
  normalizeMarkers(ed);
  ed.dispatchEvent(new Event('input'));
  const s = getSelection(); if (s.rangeCount) savedRange = s.getRangeAt(0).cloneRange();
  updateToolbarState();
}
// Font and size go through marker values that are swapped for the real styles right after.
let markerN = 0; const MARKERS = {};
let pendingSize = null;
function applyFont(name) {
  const f = FONTS[name]; if (!f) return;
  const m = 'jfm' + (++markerN);
  MARKERS[m] = f;
  exec('fontName', m);
  curFont = name; $('#fontLabel').textContent = name; $('#fontLabel').style.fontFamily = f.css;
}
function applySize(px) { pendingSize = px; exec('fontSize', '7'); }
function normalizeMarkers(ed) {
  $$('font[face], [style*="font-family"]', ed).forEach(el => {
    const face = (el.getAttribute('face') || el.style.fontFamily || '').replace(/["']/g, '');
    const f = MARKERS[face];
    if (!f) return;
    const span = el.tagName === 'FONT' ? swapToSpan(el) : el;
    span.style.fontFamily = f.css; span.style.fontWeight = f.weight; span.style.fontStyle = f.style;
  });
  $$('font[size="7"], [style*="xxx-large"]', ed).forEach(el => {
    const span = el.tagName === 'FONT' ? swapToSpan(el) : el;
    span.style.fontSize = (pendingSize || 17) + 'px';
    span.style.lineHeight = '1.3';
  });
}
function swapToSpan(font) {
  const span = document.createElement('span');
  if (font.getAttribute('color')) span.style.color = font.getAttribute('color');
  if (font.style.cssText) span.style.cssText += font.style.cssText;
  while (font.firstChild) span.appendChild(font.firstChild);
  font.replaceWith(span);
  return span;
}
let curFont = 'Charter BT';
function updateToolbarState() {
  ['bold', 'italic', 'underline', 'strikeThrough', 'justifyLeft', 'justifyCenter', 'justifyRight', 'insertUnorderedList'].forEach(c => {
    const b = $(`.tb[data-cmd="${c}"]`); if (!b) return;
    let on = false; try { on = document.queryCommandState(c); } catch (e) {}
    b.classList.toggle('on', on);
  });
  const sel = getSelection(); if (!sel.anchorNode) return;
  const el = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  if (!el || !el.closest('.editor, .tb-body')) return;
  const cs = getComputedStyle(el);
  const px = Math.round(parseFloat(cs.fontSize));
  const ss = $('#sizeSel');
  if (![...ss.options].some(o => Number(o.value) === px)) { $$('option.tmp', ss).forEach(o => o.remove()); ss.append(h('option', { class: 'tmp', value: px }, px)); }
  ss.value = px;
  const norm = v => v.replace(/["']/g, '').replace(/\s*,\s*/g, ',').toLowerCase();
  const fam = norm(cs.fontFamily);
  const match = Object.values(FONTS).find(f => norm(f.css) === fam);
  const name = match ? match.name : 'Charter BT';
  $('#fontLabel').textContent = name; $('#fontLabel').style.fontFamily = (FONTS[name] || {}).css || '';
  curFont = name;
}
// keep the text selection when pressing toolbar buttons
$('#toolbar').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
$$('.tb[data-cmd]').forEach(b => b.addEventListener('click', () => exec(b.dataset.cmd)));

// popovers
function closePops() { $$('.pop').forEach(p => p.hidden = true); }
function openPop(pop, anchor) {
  const was = !pop.hidden; closePops(); if (was) return;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(); const pw = pop.offsetWidth;
  let left = r.left + scrollX; left = Math.max(16 + scrollX, Math.min(left, scrollX + document.documentElement.clientWidth - pw - 16));
  pop.style.left = left + 'px'; pop.style.top = (r.bottom + scrollY + 6) + 'px';
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.pop') && !e.target.closest('#toolbar')) closePops(); });

// pictures
function addImageUrl(src) {
  const entry = currentEntry(); const canvas = currentCanvas();
  if (!entry || !canvas) return;
  const w = 26;
  const s = { id: uid(), src, x: 37 + (entry.stickers.length % 3) * 5, y: 20 + (entry.stickers.length % 3) * 5, w, rot: [-3, 2, -1, 3][entry.stickers.length % 4], frame: 'plain', z: 3 + entry.stickers.length };
  entry.stickers.push(s);
  const el = stickerEl(s, entry); canvas.append(el); selectSticker(el); save(true); closePops();
}
const cq = $('#cq'), coverHits = $('#coverHits'), coverMsg = $('#coverMsg');
async function findCovers() {
  const q = cq.value.trim(); if (!q) return;
  coverHits.innerHTML = ''; coverMsg.textContent = 'Searching Google Books…';
  const hits = await googleBooks(q, 12);
  if (!hits) {
    coverMsg.textContent = 'Google Books can’t be reached right now. Try the Pictures button instead.';
    return;
  }
  const withCovers = hits.filter(b => b.cover);
  if (!withCovers.length) { coverMsg.textContent = `No covers found for “${q}”.`; return; }
  coverMsg.textContent = 'Pick a cover to add it to this page.';
  withCovers.forEach(b => coverHits.append(h('button', { type: 'button', title: b.title, onmousedown: e => e.preventDefault(), onclick: () => addImageUrl(b.cover) },
    h('img', { src: b.cover, alt: b.title }), h('span', {}, b.title))));
}
$('#cqBtn').addEventListener('click', findCovers);

cq.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); findCovers(); } });
// Picture search uses Pixabay (free key from pixabay.com/api/docs). Paste the key here.
const PIXABAY_KEY = '57900009-5e974e03b01c87abbdaeba031';
const gq = $('#gq'), picHits = $('#picHits'), picMsg = $('#picMsg');
async function findPictures() {
  const q = gq.value.trim(); if (!q) return;
  picHits.innerHTML = '';
  if (!PIXABAY_KEY) { picMsg.textContent = 'Picture search needs a Pixabay key. You can still paste or upload a picture below.'; return; }
  picMsg.textContent = 'Searching…';
  let hits = null;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch('https://pixabay.com/api/?safesearch=true&per_page=24&image_type=all&key=' + encodeURIComponent(PIXABAY_KEY) + '&q=' + encodeURIComponent(q.slice(0, 100)), { signal: ctl.signal });
    if (r.ok) hits = (await r.json()).hits || [];
  } catch (e) {} finally { clearTimeout(t); }
  if (!hits) { picMsg.textContent = 'Picture search isn’t answering right now. You can still paste or upload a picture below.'; return; }
  if (!hits.length) { picMsg.textContent = `No pictures found for “${q}”. Try fewer or different words.`; return; }
  picMsg.textContent = 'Pick a picture to add it to this page.';
  $('#picCredit').hidden = false;
  hits.forEach(p => picHits.append(h('button', { type: 'button', title: p.tags, onmousedown: e => e.preventDefault(), onclick: () => addPixabay(p) },
    h('img', { src: p.previewURL, alt: p.tags || 'Picture', loading: 'lazy' }))));
}
// Save a copy of the picture in the journal, so it keeps showing after Pixabay's link expires.
async function addPixabay(p) {
  picMsg.textContent = 'Adding…';
  try {
    const r = await fetch(p.webformatURL);
    if (!r.ok) throw 0;
    const blob = await r.blob();
    await addImage(new File([blob], 'pixabay.jpg', { type: blob.type || 'image/jpeg' }));
  } catch (e) { addImageUrl(p.webformatURL); }
}

});

(async () => {
  storageOK = await Store.open();
  const saved = storageOK ? await Store.get('state') : null;
